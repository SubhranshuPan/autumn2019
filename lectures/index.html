  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      overflow: hidden;
    }
  </style>
  <script>
    // Auto-activate fullscreen mode if no mode is specified
    (function() {
      var hash = window.location.hash;
      if (hash.indexOf('mode=') === -1 && hash.indexOf('include=') !== -1) {
        window.location.hash = hash + '&mode=fullScreen';
      }
    })();
  </script>
